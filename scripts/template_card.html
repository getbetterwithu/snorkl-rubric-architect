<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      width: 1000px;
      height: 500px;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      width: 996px;
      height: 496px;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      display: flex;
      padding: 30px 40px;
      position: relative;
    }
    .divider {
      position: absolute;
      left: 470px;
      top: 30px;
      bottom: 30px;
      width: 1px;
      border-left: 2px dashed #CBD5E1;
    }
    .passage {
      width: 430px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #0F172A;
      font-size: 21px;
      line-height: 1.7;
      letter-spacing: -0.3px;
    }
    .category-tag {
      font-size: 14px;
      font-weight: 700;
      color: #0284C7;
      margin-bottom: 12px;
      letter-spacing: -0.2px;
    }
    .problem-header {
      font-size: 24px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.45;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .problem-formula {
      margin: 14px 0;
      padding: 12px 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      font-size: 1.15em;
      min-height: 58px;
    }
    .problem-formula .katex-display {
      margin: 0;
      text-align: left;
    }
    .passage .katex {
      font-family: KaTeX_Main, "Times New Roman", serif;
    }
    .target-question {
      margin-top: 14px;
      font-size: 21px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.5;
      letter-spacing: -0.4px;
    }
    .condition-text {
      margin-top: 14px;
      font-size: 14px;
      color: #64748B;
      font-weight: 400;
    }
    .geometry {
      position: absolute;
      left: 490px;
      top: 20px;
      width: 480px;
      height: 456px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .student-workspace {
      position: absolute;
      left: 490px;
      top: 25px;
      width: 476px;
      height: 446px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px 14px 14px;
    }
    .workspace-top {
      display: flex;
      justify-content: flex-start;
    }
    .workspace-badge {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 4px 10px;
      letter-spacing: -0.2px;
    }
    .workspace-middle {
      flex: 1;
      width: 100%;
    }
    .workspace-bottom {
      display: flex;
      justify-content: flex-end;
    }
    .workspace-bottom-hint {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: -0.2px;
    }
    svg {
      overflow: visible;
    }
    .vertex-label {
      font-family: "Times New Roman", Times, serif;
      font-size: 24px;
      font-weight: bold;
      fill: #1E293B;
    }
    .dim-halo {
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      font-weight: bold;
      fill: #0F172A;
      paint-order: stroke fill;
      stroke: #FFFFFF;
      stroke-width: 7px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .dim-var {
      font-family: KaTeX_Math, "Times New Roman", italic, serif;
      font-style: italic;
      font-size: 18px;
      font-weight: bold;
      fill: #0F172A;
      paint-order: stroke fill;
      stroke: #FFFFFF;
      stroke-width: 7px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .angle-label {
      font-family: -apple-system, BlinkMacSystemFont, "Times New Roman", sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: #0F172A;
      paint-order: stroke fill;
      stroke: #FFFFFF;
      stroke-width: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="passage">
      <!-- PASSAGE_HTML_PLACEHOLDER -->
    </div>

    <div class="divider"></div>

    <!-- 비도형 대수 문항용 학생 필기 공간 (기본) -->
    <!-- RIGHT_PANEL_PLACEHOLDER -->
  </div>

  <script>
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ]
    });
  </script>
</body>
</html>
