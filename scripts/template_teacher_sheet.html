  <div class="header">
    <div>
      <span style="font-size: 10px; color: #0284C7; font-weight: 700; letter-spacing: 0.5px;">SNORKL 서논술형 평가</span>

  <!-- CONTENT_HTML_PLACEHOLDER -->

  <div class="footer">
    <span>Snorkl Rubric Architect v15.0</span>
    <span>https://teacher.snorkl.app/home</span>
  </div>

  <script>
    (function() {
      document.documentElement.dataset.renderStatus = 'pending';
      document.documentElement.dataset.renderReady = 'false';
      const baseErrors = [];
      if (typeof renderMathInElement !== 'function') {
        baseErrors.push('katex_not_loaded');
      } else {
        try {
          renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false,
            strict: false
          });
        } catch (err) {
          baseErrors.push('katex_exception:' + String(err));
        }
      }

      function finalizeAudit(markReady) {
        const errors = baseErrors.slice();
        const katexErrors = document.querySelectorAll('.katex-error');
        if (katexErrors.length > 0) {
          const detail = Array.from(katexErrors).map(function(e) { return e.textContent.trim(); }).join('|');
          errors.push('katex_parse_error:' + detail);
        }

        const clone = document.body.cloneNode(true);
        clone.querySelectorAll('script, style, svg').forEach(function(el) { el.remove(); });
        if (clone.textContent.indexOf('$') !== -1) {
          errors.push('unrendered_dollar_in_dom');
        }

        document.querySelectorAll('img').forEach(function(img) {
          if (markReady) {
            if (!img.complete || img.naturalWidth === 0) {
              errors.push('broken_image:' + (img.getAttribute('src') || 'unknown'));
            }
          } else if (img.complete && img.naturalWidth === 0) {
            errors.push('broken_image:' + (img.getAttribute('src') || 'unknown'));
          }
        });

        document.querySelectorAll('body, table, .info-box, .alt-solutions-box, .guardrails-box').forEach(function(el) {
          const cs = window.getComputedStyle(el);
          if (cs.overflow === 'hidden' || cs.overflowY === 'hidden') {
            errors.push('illegal_overflow_clipping:' + (el.className || el.tagName));
          }
          if (el.scrollWidth > el.clientWidth + 6) {
            errors.push('horizontal_overflow:' + (el.className || el.tagName));
          }
        });

        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const checkedEls = new Set();
        let tNode;
        while ((tNode = walker.nextNode())) {
          if (!tNode.nodeValue || !tNode.nodeValue.replace(/[\s\u200b-\u200d\ufeff]/g, '')) continue;
          const rawEl = tNode.parentElement;
          if (!rawEl) continue;
          if (rawEl.closest('script, style, svg, .katex-mathml, .vlist-s')) continue;
          const katexRoot = rawEl.closest('.katex');
          const el = katexRoot || rawEl;
          if (checkedEls.has(el)) continue;
          checkedEls.add(el);
          const cs = window.getComputedStyle(el);
          if (cs.display === 'none' || cs.visibility === 'hidden') continue;
          const fs = parseFloat(cs.fontSize || '11');
          if (fs < 9.8) {
            errors.push('font_too_small:' + (el.className || el.tagName) + '(' + fs + 'px)');
          }
          if (!katexRoot && (cs.overflow === 'hidden' || cs.overflowY === 'hidden')) {
            errors.push('illegal_overflow_clipping:' + (el.className || el.tagName));
          }
        }

        document.documentElement.dataset.renderStatus = errors.length === 0 ? 'ok' : errors.join(';');
        if (markReady) {
          document.documentElement.dataset.renderReady = 'true';
        }
      }

      finalizeAudit(false);

      const fontPromise = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      const imagePromises = Array.from(document.images || []).map(function(img) {
        return img.complete ? Promise.resolve() : new Promise(function(resolve) {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      });

      Promise.all([fontPromise].concat(imagePromises)).then(function() {
        setTimeout(function() { finalizeAudit(true); }, 20);
      });
    })();
  </script>
