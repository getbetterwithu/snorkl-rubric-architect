<body>
  <div class="card">
    <div class="passage">
      <div class="category-tag">2022 개정 중2 수학 | 변화와 관계 · 일차부등식</div>
      <div class="problem-header">다음 일차부등식을 만족시키는 가장 큰 자연수 $x$의 값을 구하려고 한다.</div>
      <div class="problem-formula">$$\frac{2}{5}x - \frac{1}{2} > \frac{2x - 4}{3}$$</div>
      <div class="target-question">부등식의 성질을 이용하여 주어진 일차부등식의 해를 구하고, 이를 만족시키는 가장 큰 자연수 $x$의 값을 풀이 과정과 함께 서술하시오.</div>
    </div>

    <div class="divider"></div>

    <!-- 오른쪽 영역: 기하 SVG(.geometry) 또는 학생 화이트보드 여백(.student-workspace) -->
    <div class="student-workspace">
      <div class="workspace-top"><span class="workspace-badge">✏️ 풀이 과정을 자유롭게 적어 보세요</span></div>
      <div class="workspace-middle"></div>
      <div class="workspace-bottom"><span class="workspace-bottom-hint">식과 이유를 함께 말하거나 적어 주면 더 정확한 피드백을 받을 수 있습니다.</span></div>
    </div>
  </div>

  <script>
    (function() {
      document.documentElement.dataset.renderStatus = 'pending';
      const baseErrors = [];
      if (typeof renderMathInElement !== 'function') {
        baseErrors.push('katex_not_loaded');
      } else {
        try {
          renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false,
            strict: false
          });
        } catch (err) {
          baseErrors.push('katex_exception:' + String(err));
        }
      }

      function finalizeAudit() {
        const errors = baseErrors.slice();
        const katexErrors = document.querySelectorAll('.katex-error');
        if (katexErrors.length > 0) {
          const detail = Array.from(katexErrors).map(function(e) { return e.textContent.trim(); }).join('|');
          errors.push('katex_parse_error:' + detail);
        }

        const clone = document.body.cloneNode(true);
        clone.querySelectorAll('script, style, svg').forEach(function(el) { el.remove(); });
        if (clone.textContent.indexOf('$') !== -1) {
          errors.push('unrendered_dollar_in_dom');
        }

        document.querySelectorAll('.card, .passage, .problem-formula').forEach(function(el) {
          if (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2) {
            errors.push('layout_overflow:' + el.className);
          }
        });

        const passage = document.querySelector('.passage');
        if (passage) {
          const fs = parseFloat(window.getComputedStyle(passage).fontSize || '20');
          if (fs < 15.0) {
            errors.push('font_too_small:passage(' + fs + 'px)');
          }
        }

        document.querySelectorAll('img').forEach(function(img) {
          if (!img.complete || img.naturalWidth === 0) {
            errors.push('broken_image:' + (img.getAttribute('src') || 'unknown'));
          }
        });

        document.documentElement.dataset.renderStatus = errors.length === 0 ? 'ok' : errors.join(';');
        document.documentElement.dataset.renderReady = 'true';
      }

      finalizeAudit();

      const fontPromise = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      const imagePromises = Array.from(document.images || []).map(function(img) {
        return img.complete ? Promise.resolve() : new Promise(function(resolve) {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      });

      Promise.all([fontPromise].concat(imagePromises)).then(function() {
        setTimeout(finalizeAudit, 20);
      });
    })();
  </script>
